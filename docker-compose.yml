services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /data/postgres
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - ecommerce-network

    api-gateway:
        container_name: api-gateway
        build:
            context: ./api-gateway
            dockerfile: Dockerfile
        ports:
            - '3000:3000'

        volumes:
            - ./api-gateway:/app
            - /app/node_modules
        networks:
            - ecommerce-network

    auth-microservice:
        container_name: auth-microservice
        restart: always
        build:
            context: ./auth-microservice
            dockerfile: Dockerfile
        volumes:
            - ./auth-microservice:/app
            - /app/node_modules
        networks:
            - ecommerce-network

    users-microservice:
        container_name: users-microservice
        build:
            context: ./users-microservice
            dockerfile: Dockerfile
        volumes:
            - ./users-microservice:/app
            - /app/node_modules
        networks:
            - ecommerce-network

    products-microservice:
        container_name: products-microservice
        restart: always
        build:
            context: ./products-microservice
            dockerfile: Dockerfile
        volumes:
            - ./products-microservice:/app
            - /app/node_modules
        networks:
            - ecommerce-network

networks:
    ecommerce-network:
        driver: bridge

volumes:
    postgres_data:
