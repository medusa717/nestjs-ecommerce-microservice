services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /data/postgres
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - ecommerce-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 5

    mongo:
        image: mongo
        container_name: mongo-db
        ports:
            - '27017:27017'
        networks:
            - ecommerce-network
        volumes:
            - mongo-data:/data/db

    zookeeper:
        image: confluentinc/cp-zookeeper:latest
        container_name: zookeeper
        ports:
            - '2181:2181'
        networks:
            - ecommerce-network
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181

    kafka:
        image: confluentinc/cp-kafka:latest
        container_name: kafka
        ports:
            - '9092:9092'
        networks:
            - ecommerce-network
        depends_on:
            - zookeeper
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    api-gateway:
        container_name: api-gateway
        build:
            context: .
            dockerfile: ./api-gateway/dockerfile
        ports:
            - '3000:3000'
        volumes:
            # Bind mount sayesinde kodda değişiklik otomatik yüklenir
            - ./api-gateway:/usr/src/app/api-gateway
            - /usr/src/app/api-gateway/node_modules

            # Ortak kütüphane bind mount ile paylaşılır:
            - ./common/dist:/usr/src/app/common/dist
            - ./common/node_modules:/usr/src/app/common/node_modules
        networks:
            - ecommerce-network
        depends_on:
            - users-microservice
            - auth-microservice
            - products-microservice
            - orders-microservice

    auth-microservice:
        container_name: auth-microservice
        restart: always
        build:
            context: .
            dockerfile: ./auth-microservice/dockerfile
        volumes:
            # Bind mount sayesinde kodda değişiklik otomatik yüklenir
            - ./auth-microservice:/usr/src/app/auth-microservice
            - /usr/src/app/auth-microservice/node_modules

            # Ortak kütüphane bind mount ile paylaşılır:
            - ./common/dist:/usr/src/app/common/dist
            - ./common/node_modules:/usr/src/app/common/node_modules
        networks:
            - ecommerce-network
        depends_on:
            postgres:
                condition: service_healthy
            users-microservice:
                condition: service_started

    users-microservice:
        container_name: users-microservice
        build:
            context: .
            dockerfile: ./users-microservice/dockerfile
        volumes:
            # Bind mount sayesinde kodda değişiklik otomatik yüklenir
            - ./users-microservice:/usr/src/app/users-microservice
            - /usr/src/app/users-microservice/node_modules

            # Ortak kütüphane bind mount ile paylaşılır:
            - ./common/dist:/usr/src/app/common/dist
            - ./common/node_modules:/usr/src/app/common/node_modules
        networks:
            - ecommerce-network
        depends_on:
            postgres:
                condition: service_healthy

    products-microservice:
        container_name: products-microservice
        build:
            context: .
            dockerfile: ./products-microservice/dockerfile
        volumes:
            # Bind mount sayesinde kodda değişiklik otomatik yüklenir
            - ./products-microservice:/usr/src/app/products-microservice
