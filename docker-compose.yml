services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /data/postgres
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - ecommerce-network

    pgadmin:
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
            PGADMIN_CONFIG_SERVER_MODE: 'False'
        volumes:
            - pgadmin:/var/lib/pgadmin
        ports:
            - '${PGADMIN_PORT}:80'
        networks:
            - ecommerce-network
        restart: unless-stopped

    mongo:
        image: mongo
        ports:
            - '27017:27017'
        networks:
            - ecommerce-network
        volumes:
            - mongo-data:/data/db

    api-gateway:
        container_name: api-gateway
        build:
            context: ./api-gateway
            dockerfile: Dockerfile
        ports:
            - '3000:3000'

        volumes:
            - ./api-gateway:/app
            - /app/node_modules
        networks:
            - ecommerce-network

    users-microservice:
        container_name: users-microservice
        build:
            context: ./users-microservice
            dockerfile: Dockerfile
        volumes:
            - ./users-microservice:/app
            - /app/node_modules
        networks:
            - ecommerce-network

networks:
    ecommerce-network:
        driver: bridge

volumes:
    postgres_data:
    pgadmin:
    mongo-data:
